<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Default Project recovery workflow</title>
  <desc id="desc">Four colorful cartoon panels: start from template, retrieve only relevant context, verify with tests, and ship through a protected pull request.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e7"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="6" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="470" rx="30" fill="url(#bg2)"/><text x="600" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#28263a">Fresh session, same project truth</text>
  <g font-family="Arial,sans-serif" fill="#28263a" stroke="#28263a" stroke-width="4" filter="url(#s)">
    <g transform="translate(45 105)"><rect width="240" height="270" rx="26" fill="#fff"/><circle cx="120" cy="78" r="48" fill="#ffd56a"/><path d="M84 77h72v70H84z" fill="#8b6bff"/><path d="M84 77h32l10-15h30v15" fill="#ae9aff"/><text x="120" y="184" text-anchor="middle" font-size="23" font-weight="700" stroke="none">1. Start</text><text x="120" y="216" text-anchor="middle" font-size="17" stroke="none">Use template</text><text x="120" y="242" text-anchor="middle" font-size="17" stroke="none">Read AGENTS.md</text></g>
    <g transform="translate(335 105)"><rect width="240" height="270" rx="26" fill="#fff"/><circle cx="120" cy="78" r="48" fill="#8be1d1"/><path d="M82 57h76v70H82z" fill="#fff"/><path d="M96 76h48M96 94h35M96 112h42" stroke="#5f72ff" stroke-width="7" stroke-linecap="round"/><text x="120" y="184" text-anchor="middle" font-size="23" font-weight="700" stroke="none">2. Retrieve</text><text x="120" y="216" text-anchor="middle" font-size="17" stroke="none">Search first</text><text x="120" y="242" text-anchor="middle" font-size="17" stroke="none">Load only what matters</text></g>
    <g transform="translate(625 105)"><rect width="240" height="270" rx="26" fill="#fff"/><circle cx="120" cy="78" r="48" fill="#a8c4ff"/><path d="M120 38l44 16v35c0 34-23 57-44 68-21-11-44-34-44-68V54z" fill="#fff"/><path d="M95 91l17 17 34-41" fill="none" stroke="#35b785" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="184" text-anchor="middle" font-size="23" font-weight="700" stroke="none">3. Verify</text><text x="120" y="216" text-anchor="middle" font-size="17" stroke="none">Run real checks</text><text x="120" y="242" text-anchor="middle" font-size="17" stroke="none">Evidence beats memory</text></g>
    <g transform="translate(915 105)"><rect width="240" height="270" rx="26" fill="#fff"/><circle cx="120" cy="78" r="48" fill="#ff9fb8"/><path d="M82 65h76v57H82z" fill="#fff"/><path d="M95 80h50M95 97h38" stroke="#5f72ff" stroke-width="7" stroke-linecap="round"/><circle cx="159" cy="121" r="21" fill="#35b785"/><path d="M149 121l7 7 14-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="120" y="184" text-anchor="middle" font-size="23" font-weight="700" stroke="none">4. Ship</text><text x="120" y="216" text-anchor="middle" font-size="17" stroke="none">Protected PR</text><text x="120" y="242" text-anchor="middle" font-size="17" stroke="none">CI before main</text></g>
  </g>
  <g fill="none" stroke="#6c6a80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M292 240h32l-11-11m11 11-11 11"/><path d="M582 240h32l-11-11m11 11-11 11"/><path d="M872 240h32l-11-11m11 11-11 11"/></g><text x="600" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6c6a80">Conversation is context. Repository evidence is the source of truth.</text>
</svg>
