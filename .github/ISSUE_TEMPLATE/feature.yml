name: Feature request
description: Propose a concrete product or engineering outcome
title: "[Feature]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible when this is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed, and who or what is affected?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Known compatibility, security, performance, scope, or rollout constraints.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Links to current behavior, user reports, measurements, designs, or related decisions.
    validations:
      required: false
