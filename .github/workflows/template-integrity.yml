name: Template integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate agent-ready template
        run: bash scripts/validate-template.sh
      - name: Test GitHub repository setup helper
        run: bash scripts/test-github-setup.sh
      - name: Test default-init distribution when present
        shell: bash
        run: |
          if [ -f scripts/test-default-init.sh ]; then
            bash scripts/test-default-init.sh
          fi
      - name: Smoke-test checkpoint helper
        shell: bash
        run: |
          output=$(bash scripts/checkpoint.sh)
          printf '%s\n' "$output"
          grep -q '^=== repository checkpoint ===$' <<< "$output"
          grep -q '^head: ' <<< "$output"
          grep -q '^--- recent commits ---$' <<< "$output"
